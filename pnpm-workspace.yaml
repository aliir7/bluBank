packages:
  - apps/*

# Single source of truth for versions shared by several workspaces.
# Reference them from a package.json with "catalog:".
catalog:
  '@eslint/js': 10.0.1
  '@types/node': ^24.19.2
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  eslint: ^10.12.0
  eslint-config-prettier: 10.1.8
  eslint-plugin-react-hooks: 7.1.1
  eslint-plugin-react-refresh: 0.5.7
  eslint-plugin-simple-import-sort: 14.0.0
  # Keep in lockstep with the root turbo version.
  eslint-plugin-turbo: 2.11.8
  globals: 17.13.0
  react: ^19.3.1
  react-dom: ^19.3.1
  rimraf: ^6.1.3
  typescript: ~6.0.3
  typescript-eslint: 8.71.2

engineStrict: true
# Fail the install on any unmet or conflicting peer dependency instead of warning.
strictPeerDependencies: true

# pnpm 12 fails the install when a dependency has a build script that is not
# explicitly allowed (true) or denied (false) here. SWC needs its postinstall
# script to materialize the platform binary.
allowBuilds:
  '@swc/core': true

# pnpm 12 quarantines versions published in the last day (minimumReleaseAge).
# These pins were newer than that when the repo was bootstrapped on 2026-10-15
# (latest stable at the time). Once they are older than the window, this list
# can be deleted with no other change.
minimumReleaseAgeExclude:
  - '@next/eslint-plugin-next@16.4.1'
  - '@next/env@16.4.1'
  - '@next/swc-darwin-arm64@16.4.1'
  - '@next/swc-darwin-x64@16.4.1'
  - '@next/swc-linux-arm64-gnu@16.4.1'
  - '@next/swc-linux-arm64-musl@16.4.1'
  - '@next/swc-linux-x64-gnu@16.4.1'
  - '@next/swc-linux-x64-musl@16.4.1'
  - '@next/swc-win32-arm64-msvc@16.4.1'
  - '@next/swc-win32-x64-msvc@16.4.1'
  - next@16.4.1
  - react-dom@19.3.1
  - react@19.3.1
